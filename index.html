<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C45E28" />

    <!-- iOS "Add to Home Screen" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Woven" />

    <title>Woven — Where your story comes together</title>
    <meta name="description" content="A graph-native writing environment for novelists. Connect ideation, planning, and drafting in one space." />

    <!-- Social sharing preview (iMessage, Slack, Twitter, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Woven" />
    <meta property="og:title" content="Woven" />
    <meta property="og:description" content="A graph-native writing environment for novelists." />
    <meta property="og:image" content="https://wovenwrite.com/og-image.png" />
    <meta property="og:url" content="https://wovenwrite.com" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Woven" />
    <meta name="twitter:description" content="A graph-native writing environment for novelists." />
    <meta name="twitter:image" content="https://wovenwrite.com/og-image.png" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <!-- Quill — required by DraftEditor.jsx. Without these, window.Quill is
         undefined and the editor silently never initializes. -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.bubble.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>

    <!-- jsPDF — required by App.jsx's PDF export (window.doExport, format
         'PDF'). Without this, window.jspdf is undefined and export shows
         "PDF export is still loading" indefinitely. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>

    <!-- Editor font choices — required by DraftEditor.jsx's font picker.
         Crimson Text / DM Sans already load via App.jsx's CSS; the rest of
         the FONTS list needs this to render correctly instead of falling
         back to system fonts. -->
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;1,300&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&family=Roboto:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Open+Sans:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Nunito:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
